name: Osvježi podatke

# NE RADI S GITHUBOVIH POSLUŽITELJA. API platforme Otvoreno odbija adrese
# podatkovnih centara s HTTP 403 — provjereno: isti zahtjev s obične veze prolazi,
# a s GitHubova poslužitelja ne prolazi ni nakon čekanja od jedanaest minuta.
#
# Zbog toga je tjedno pokretanje isključeno; posao bi svaki put pao i slao
# obavijest o grešci. Ostaje ručno pokretanje za slučaj da se to promijeni.
#
# Podaci se do tada osvježavaju s obične veze:
#   .venv/bin/python scripts/dohvati_dane.py --zadnjih 45
#   .venv/bin/python scripts/build_data.py
#   .venv/bin/python scripts/build_isplate.py
#   .venv/bin/python scripts/build_preuzimanje.py
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osvjezi-podatke
  cancel-in-progress: false

jobs:
  osvjezi:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj ovisnosti
        run: pip install --quiet pandas openpyxl pyshp pyproj

      # Sirovi zapisi su prevelici za repozitorij (oko 600 MB), pa stoje u
      # međuspremniku radnog toka. Ključ s datumom osigurava da se svaki tjedan
      # spremi nova inačica, a restore-keys vraća najsvježiju postojeću.
      - name: Vrati predmemorij isplata
        id: predmemorij
        uses: actions/cache@v4
        with:
          path: Data za prototip/api/isplate.jsonl
          key: isplate-${{ github.run_id }}
          restore-keys: isplate-

      # Zapamti stanje prije dohvata da se poslije provjeri da nije nazadovalo.
      - name: Zapamti dosadašnji broj isplata
        id: prije
        run: |
          echo "isplata=$(python -c "import json;print(json.load(open('public/data/meta.json'))['broj_isplata'])")" >> "$GITHUB_OUTPUT"

      # Prvi put nema predmemorija, pa se radi potpuni dohvat. Poslije se
      # dohvaćaju samo zadnji dani, što je brže i manje opterećuje poslužitelj.
      - name: Dohvati isplate
        run: |
          if [ -s "Data za prototip/api/isplate.jsonl" ]; then
            echo "Predmemorij ima $(wc -l < 'Data za prototip/api/isplate.jsonl') zapisa — dohvaćam zadnje dane."
            python scripts/dohvati_dane.py --zadnjih 45
          else
            echo "Nema predmemorija — radim potpuni dohvat."
            python scripts/fetch_api.py
          fi

      - name: Izgradi podatke
        run: |
          python scripts/build_data.py
          python scripts/build_isplate.py
          python scripts/build_preuzimanje.py

      # Poslužitelj zna prekinuti dohvat na pola (ograničenje po IP-u). Bez ove
      # provjere bi se krnji skup objavio i pregazio ispravne podatke.
      - name: Provjeri da podaci nisu nazadovali
        run: |
          POSLIJE=$(python -c "import json;print(json.load(open('public/data/meta.json'))['broj_isplata'])")
          PRIJE=${{ steps.prije.outputs.isplata }}
          echo "Prije: $PRIJE, poslije: $POSLIJE"
          if [ "$POSLIJE" -lt "$PRIJE" ]; then
            echo "::error::Nakon dohvata ima manje isplata nego prije ($POSLIJE < $PRIJE). Ne objavljujem."
            exit 1
          fi

      - name: Objavi ako ima promjena
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nema novih podataka."
            exit 0
          fi
          ZADNJI=$(python -c "import json;print(json.load(open('public/data/meta.json'))['zadnji_datum'])")
          git commit -m "Osvježi podatke do ${ZADNJI}

          Automatski dohvat novih isplate s API-ja platforme Otvoreno."
          git push
